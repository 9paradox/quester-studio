name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. 0.4.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Writes .npmrc so NODE_AUTH_TOKEN is used by npm/changeset publish
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Publish to npm
        run: bun run release:pkgs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-desktop:
    needs: publish-npm
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build:pkgs
      - name: Install NSIS (Windows installer)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - name: Build desktop app
        # vite + Electrobun → artifacts/; Windows also builds portable zip + NSIS setup
        # Windows: Quester-*-portable.zip, Quester-*-setup.exe (+ Electrobun update tarball/Setup zip)
        # Linux: setup / AppImage artifacts
        env:
          REQUIRE_NSIS: ${{ runner.os == 'Windows' && '1' || '0' }}
          MAKENSIS: ${{ runner.os == 'Windows' && 'C:\Program Files (x86)\NSIS\makensis.exe' || '' }}
        run: bun run --filter @quester-studio/desktop build:app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/artifacts/**
          if-no-files-found: error

  github-release:
    needs: release-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: |
            Development build — see [SECURITY.md](https://github.com/9paradox/quester-studio/blob/main/SECURITY.md) for download verification.

            ## Desktop (unsigned)

            - **Windows installer:** download `Quester-*-win-x64-setup.exe` — choose install folder; uninstall from Settings → Apps.
            - **Windows portable:** download `Quester-*-win-x64-portable.zip` — extract anywhere, run `Quester\bin\launcher.exe`; delete the folder to remove.
            - **Linux:** download the Linux setup / AppImage artifact for your arch.
            - macOS is not published yet.

            ## npm packages

            `@quester-studio/schema`, `@quester-studio/nodes`, `@quester-studio/engine`, `@quester-studio/cli` at v${{ inputs.version }}.
          files: artifacts/**
          draft: false
